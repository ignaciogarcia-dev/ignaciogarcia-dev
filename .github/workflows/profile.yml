name: Update profile cards
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/profile.yml]
permissions:
  contents: write
concurrency: profile
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish to output branch (single commit, no history)
        working-directory: out
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Update profile assets"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
